version: "3.8"
services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: test-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-logs
      KAFKA_CREATE_TOPICS: "raw-alert:1:1"
    networks:
      local-net:

  nifi:
    image: apache/nifi:2.9.0
    container_name: nifi-ui
    ports:
      - "8443:8443"
    environment:
      - NIFI_WEB_HTTPS_HOST=0.0.0.0
      - SINGLE_USER_CREDENTIALS_USERNAME=admin
      - SINGLE_USER_CREDENTIALS_PASSWORD=admin1234567
    volumes:
      - nifi-data:/opt/nifi/nifi-current/data
      - nifi-conf:/opt/nifi/nifi-current/conf
    networks:
      local-net:
    depends_on:
      - kafka

  minifi-cpp:
    image: apache/nifi-minifi-cpp:0.99.2
    container_name: minifi-edge
    depends_on:
      - nifi
      - kafka
    volumes:
      - ./minifi-conf:/opt/minifi/conf
      - minifi-data:/opt/minifi/data
    networks:
      local-net:

networks:
  local-net:

volumes:
  nifi-data:
  nifi-conf:
  minifi-data:
  # 删除kafka-data卷定义，不再持久化kafka数据