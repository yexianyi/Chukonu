services:
  redpanda:
    image: docker.io/redpandadata/redpanda:latest
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --memory 1G
      - --kafka-addr internal://0.0.0.0:19092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:19092,external://localhost:9092
    ports:
      - "9092:9092"
    networks:
      - redpanda_net

  console:
    image: docker.io/redpandadata/console:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: "redpanda:19092"
    depends_on:
      - redpanda
    networks:
      - redpanda_net

  connect:
    image: ghcr.io/redpanda-data/connect:latest
    volumes:
      - ./config.yaml:/config.yaml
    command: ["run", "/config.yaml"]
    depends_on:
      - redpanda
    networks:
      - redpanda_net

networks:
  redpanda_net:
    driver: bridge
